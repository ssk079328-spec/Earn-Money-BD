<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- আপনার মনিটেগ SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11003133' data-sdk='show_11003133'></script>

    <style>
        :root { --p: #6c5ce7; --s: #a29bfe; --bg: #f1f2f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .marquee { background: var(--p); color: white; padding: 10px; font-size: 13px; overflow: hidden; white-space: nowrap; border-radius: 0 0 15px 15px; }
        .marquee-inner { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .container { padding: 15px; max-width: 400px; margin: auto; }
        .card { background: linear-gradient(135deg, var(--p), var(--s)); border-radius: 25px; padding: 30px; color: white; box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2); text-align: center; margin-bottom: 20px; }
        .balance { font-size: 38px; font-weight: 800; margin: 10px 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { background: white; border: none; padding: 18px; border-radius: 20px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        .btn-main { grid-column: span 2; background: #2d3436; color: white; font-size: 18px; padding: 25px; }
    </style>
</head>
<body>

<div class="marquee">
    <div class="marquee-inner">📢 প্রতি ভিডিওতে ০.২০ টাকা আয় করুন। ৫ জন রেফার করলে ১০ টাকা বোনাস! দ্রুত পেমেন্ট বিকাশ ও নগদে।</div>
</div>

<div class="container">
    <div class="card">
        <div id="u-name" style="font-size: 18px; opacity: 0.9;">Loading...</div>
        <div style="font-size: 12px; margin-top: 15px; letter-spacing: 1px;">CURRENT BALANCE</div>
        <div class="balance">৳ <span id="bal">0.00</span></div>
    </div>

    <div class="grid">
        <button class="btn btn-main" onclick="watchAd()">📺 Earn Money (0.20 TK)</button>
        <button class="btn" onclick="claimDaily()">🎁 Daily Reward</button>
        <button class="btn" onclick="shareRefer()">🔗 Refer Link</button>
        <button class="btn" onclick="tg.showAlert('মিনিমাম উইথড্র ৫০ টাকা।')">💸 Withdraw</button>
        <button class="btn" onclick="tg.showAlert('ID: '+userId)">👤 Profile</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe.user.id;
    const apiBase = "https://earn-money-bd.onrender.com";

    // ইন-অ্যাপ অটো অ্যাড সেটিংস
    show_11003133({ type: 'inApp', inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5 }});

    function load() {
        document.getElementById('u-name').innerText = "হ্যালো, " + tg.initDataUnsafe.user.first_name;
        fetch(`${apiBase}/api/user/${userId}`).then(r => r.json()).then(d => {
            document.getElementById('bal').innerText = d.balance.toFixed(2);
        });
    }
    load();

    function watchAd() {
        if (typeof show_11003133 === 'function') {
            // YMID হিসেবে ইউজার আইডি পাঠানো হচ্ছে পোস্টব্যাকের জন্য
            show_11003133({ ymid: userId }).then(() => {
                tg.showAlert("বিজ্ঞাপন দেখা শেষ! ০.২০ টাকা যোগ হচ্ছে...");
                setTimeout(load, 3000); 
            });
        }
    }

    function claimDaily() {
        const last = localStorage.getItem('daily_'+userId);
        if (last && (Date.now() - last) < 86400000) return tg.showAlert("আগামীকাল আবার চেষ্টা করুন!");
        localStorage.setItem('daily_'+userId, Date.now());
        updateDB(1.0, "ডেইলি বোনাস যোগ হয়েছে!");
    }

    function shareRefer() {
        const link = `https://t.me/Emoneybd_Bot?start=${userId}`;
        navigator.clipboard.writeText(link);
        tg.showAlert("রেফার লিঙ্ক কপি হয়েছে! শেয়ার করুন:\n" + link);
    }

    function updateDB(a, m) {
        fetch(`${apiBase}/api/add-balance`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chatId: userId, amount: a })
        }).then(() => { load(); tg.showAlert(m); });
    }
</script>
</body>
</html>
