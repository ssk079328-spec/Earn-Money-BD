<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- এখানে আপনার মনিটেগ স্ক্রিপ্ট ট্যাগটি দিন (যেটি আপনাকে দেওয়া হয়েছে) -->
    <script src='//protagery.com/v1/sdk.js'></script> 

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .balance-box { font-size: 32px; color: #27ae60; margin: 20px 0; font-weight: bold; }
        .btn-ad { background: #ff9f43; color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; display: block; margin: 10px auto; border: none; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-ad:hover { background: #ee5253; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="welcome">Welcome</h2>
        <p>আপনার ব্যালেন্স</p>
        <div class="balance-box">৳ <span id="balance">0.00</span></div>
        
        <button onclick="watchAd()" class="btn-ad">📺 ভিডিও দেখে আয় করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user.id;
        const backendUrl = "https://earn-money-bd.onrender.com"; // আপনার রেন্ডার ইউআরএল

        // শুরুতে ডাটা লোড করা
        function loadData() {
            document.getElementById('welcome').innerText = "হ্যালো, " + tg.initDataUnsafe.user.first_name;
            fetch(`${backendUrl}/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                });
        }
        loadData();

        // বিজ্ঞাপন দেখানোর ফাংশন
        function watchAd() {
            // আপনার দেওয়া Rewarded Ad কোড
            show_11003133().then(() => {
                // বিজ্ঞাপন সফলভাবে শেষ হলে এই অংশটি কাজ করবে (Real-Time)
                updateBalance(0.50); // প্রতি বিজ্ঞাপনে ০.৫০ টাকা যোগ হবে
            }).catch(e => {
                alert("বিজ্ঞাপন লোড হতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
            });
        }

        // ডাটাবেসে টাকা যোগ করার ফাংশন
        function updateBalance(amount) {
            fetch(`${backendUrl}/api/add-balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId: userId, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('balance').innerText = data.newBalance.toFixed(2);
                    alert("অভিনন্দন! আপনি ০.৫০ টাকা পেয়েছেন।");
                }
            });
        }
    </script>
</body>
</html>
