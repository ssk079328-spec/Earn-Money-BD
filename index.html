<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD - Premium Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11003133' data-sdk='show_11003133'></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-gradient: linear-gradient(135deg, #1e1b4b, #311042);
            --btn-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            margin: 0; padding: 0; 
        }

        .container { padding: 15px; max-width: 450px; margin: auto; box-sizing: border-box; }

        .ad-container {
            width: 100%; overflow-x: auto; background: #1e293b; padding: 10px 0;
            display: flex; justify-content: center; border-radius: 12px; margin: 15px 0; border: 1px solid #334155;
        }
        .ad-container::-webkit-scrollbar { display: none; }

        /* প্রোফাইল হেডার স্টাইল */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6366f1;
            background: #1e293b;
        }

        .user-info-text { display: flex; flex-direction: column; text-align: left; }
        .user-info-text .name { font-size: 16px; font-weight: 600; color: #fff; }
        .user-info-text .status { font-size: 12px; color: #10b981; }

        /* ব্যালেন্স কার্ড */
        .premium-card { 
            background: var(--card-gradient); border-radius: 24px; padding: 25px 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; margin-bottom: 20px; border: 1px solid #4338ca;
        }
        .balance-display { font-size: 42px; font-weight: 800; color: #fff; margin-top: 5px; }

        /* গ্রিড ও বাটন */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .premium-btn { 
            background: #1e293b; border: 1px solid #334155; padding: 18px; border-radius: 18px; 
            font-weight: 600; font-size: 14px; color: var(--text-main); cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .premium-btn:active { transform: scale(0.96); background: #334155; }
        .premium-btn-main { grid-column: span 2; background: var(--btn-gradient); border: none; font-size: 18px; padding: 22px; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="ad-container">
        <script>
          atOptions = { 'key' : 'ce39fd4725a124df25bc9e7a152fd622', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
        </script>
        <script src="https://www.highperformanceformat.com/ce39fd4725a124df25bc9e7a152fd622/invoke.js"></script>
    </div>

    <div class="profile-header">
        <img id="user-avatar" class="profile-pic" src="" alt="👤">
        <div class="user-info-text">
            <span id="u-name" class="name">Loading...</span>
            <span class="status">● Active Member</span>
        </div>
    </div>

    <div class="premium-card">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 2px;">AVAILABLE BALANCE</div>
        <div class="balance-display">৳ <span id="bal">0.00</span></div>
    </div>

    <div class="action-grid">
        <button class="premium-btn premium-btn-main" onclick="watchAd()">
            <span>📺</span> WATCH AD & EARN (৳0.20)
        </button>
        <button class="premium-btn" onclick="claimDaily()"><span>🎁</span> Daily Reward</button>
        <button class="premium-btn" onclick="shareRefer()"><span>🔗</span> Invite Link</button>
        <button class="premium-btn" onclick="tg.showAlert('মিনিমাম উইথড্র ৫০ টাকা।')"><span>💳</span> Withdraw</button>
        <button class="premium-btn" onclick="showProfile()"><span>👤</span> My Profile</button>
    </div>

    <div class="ad-container">
        <script>
          atOptions = { 'key' : 'ce39fd4725a124df25bc9e7a152fd622', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
        </script>
        <script src="https://www.highperformanceformat.com/ce39fd4725a124df25bc9e7a152fd622/invoke.js"></script>
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.backgroundColor = '#0f172a';
    tg.headerColor = '#0f172a';
    
    const userId = tg.initDataUnsafe.user.id;
    const apiBase = "https://earn-money-bd.onrender.com";

    function load() {
        // রিয়্যাল-টাইম নাম ও প্রোফাইল পিকচার লোড করা
        const user = tg.initDataUnsafe.user;
        document.getElementById('u-name').innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
        
        // যদি ইউজারের প্রোফাইল পিকচার থাকে তবে সেটি দেখাবে, না থাকলে ডিফল্ট অবতার আইকন
        if(user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
        } else {
            document.getElementById('user-avatar').src = "https://api.dicebear.com/7.x/bottts/svg?seed=" + userId;
        }

        fetch(`${apiBase}/api/user/${userId}`).then(r => r.json()).then(d => {
            document.getElementById('bal').innerText = d.balance.toFixed(2);
        });
    }
    load();

    function watchAd() {
        if (typeof show_11003133 === 'function') {
            show_11003133({ ymid: userId }).then(() => {
                tg.showAlert("বিজ্ঞাপন দেখা সফল হয়েছে!");
                setTimeout(load, 4000); 
            });
        }
    }

    function claimDaily() {
        const last = localStorage.getItem('c_'+userId);
        if (last && (Date.now() - last) < 86400000) return tg.showAlert("আগামীকাল আবার চেষ্টা করুন।");
        localStorage.setItem('c_'+userId, Date.now());
        
        fetch(`${apiBase}/api/add-balance`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chatId: userId, amount: 1.0 })
        }).then(() => { load(); tg.showAlert("৳১.০০ ডেইলি বোনাস সফল!"); });
    }

    function shareRefer() {
        const link = `https://t.me/Emoneybd_Bot?start=${userId}`;
        navigator.clipboard.writeText(link);
        tg.showAlert("আপনার রেফার লিংক কপি হয়েছে:\n" + link);
    }

    function showProfile() {
        tg.showAlert(`নাম: ${tg.initDataUnsafe.user.first_name}\nআইডি: ${userId}\nস্ট্যাটাস: প্রফেশনাল মেম্বার ✅`);
    }
</script>
</body>
</html>
