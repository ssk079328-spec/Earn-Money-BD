<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD - Professional</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11003133' data-sdk='show_11003133'></script>

    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --success: #00b894;
            --bg: #dfe6e9;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 0; 
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 450px; 
            padding: 15px;
            box-sizing: border-box;
        }

        /* চলন্ত হেডলাইন স্টাইল */
        .marquee-container {
            background: var(--primary);
            color: white;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            white-space: nowrap;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* প্রফেশনাল প্রোফাইল কার্ড */
        .profile-card { 
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 25px; 
            padding: 30px 20px; 
            color: white;
            text-align: center; 
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
            margin-bottom: 20px;
            position: relative;
        }

        .balance-label { font-size: 14px; opacity: 0.9; }
        .balance-amount { font-size: 36px; font-weight: 800; margin: 10px 0; letter-spacing: 1px; }

        /* বাটন গ্রিড */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn { 
            background: white; 
            border: none; 
            padding: 20px 10px; 
            border-radius: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            cursor: pointer; 
            font-size: 15px;
            font-weight: 600; 
            color: #2d3436;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn:active { transform: translateY(2px); box-shadow: none; }

        .btn-main { 
            grid-column: span 2; 
            background: #2d3436; 
            color: white; 
            padding: 25px; 
            font-size: 18px;
            border: 2px solid var(--secondary);
        }

        .btn-icon { font-size: 24px; margin-bottom: 8px; }

        /* ব্যানার সেকশন */
        .ad-placeholder {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px dashed #aaa;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="marquee-container">
        <div class="marquee-text">
            📢 স্বাগতম! ভিডিও দেখে আনলিমিটেড ইনকাম করুন। প্রতি রেফারে ২ টাকা বোনাস। মিনিমাম উইথড্র মাত্র ৫০ টাকা। আমাদের সাথেই থাকুন! 🚀
        </div>
    </div>

    <div class="profile-card">
        <div id="user-name" style="font-size: 18px; margin-bottom: 5px;">User Name</div>
        <div class="balance-label">Current Balance</div>
        <div class="balance-amount">৳ <span id="balance-val">0.00</span></div>
    </div>

    <div class="menu-grid">
        <button class="btn btn-main" onclick="watchAd()">
            <span class="btn-icon">💰</span> Earn Money (Watch Ad)
        </button>
        <button class="btn" onclick="claimDaily()">
            <span class="btn-icon">🎁</span> Daily Reward
        </button>
        <button class="btn" onclick="showRefer()">
            <span class="btn-icon">🔗</span> Invite & Earn
        </button>
        <button class="btn" onclick="showWithdraw()">
            <span class="btn-icon">💳</span> Withdraw
        </button>
        <button class="btn" onclick="showProfile()">
            <span class="btn-icon">👤</span> Profile
        </button>
    </div>

    <div class="ad-placeholder" id="banner-area">
        বিজ্ঞাপন লোড হচ্ছে...
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.headerColor = '#6c5ce7'; // টেলিগ্রাম হেডার কালার সেট
    const userId = tg.initDataUnsafe.user.id;
    const apiBase = "https://earn-money-bd.onrender.com";

    // ইন-অ্যাপ অ্যাড সেটিংস
    show_11003133({
      type: 'inApp',
      inAppSettings: {
        frequency: 2,
        capping: 0.1,
        interval: 30,
        timeout: 5,
        everyPage: false
      }
    });

    function loadUser() {
        document.getElementById('user-name').innerText = "Hello, " + tg.initDataUnsafe.user.first_name;
        fetch(`${apiBase}/api/user/${userId}`).then(res => res.json()).then(data => {
            document.getElementById('balance-val').innerText = data.balance.toFixed(2);
        });
    }
    loadUser();

    function watchAd() {
        if (typeof show_11003133 === 'function') {
            show_11003133().then(() => { updateDB(0.50, "৳0.50 Added!"); });
        }
    }

    function claimDaily() {
        const last = localStorage.getItem('daily_' + userId);
        const now = new Date().getTime();
        if (last && (now - last) < 86400000) {
            tg.showAlert("আগামীকাল আবার চেষ্টা করুন!");
        } else {
            localStorage.setItem('daily_' + userId, now);
            updateDB(1.00, "Daily Reward Claimed!");
        }
    }

    function showRefer() {
        const link = `https://t.me/Emoneybd_Bot?start=${userId}`;
        tg.showPopup({
            title: 'Invite Friends',
            message: `Share this link to earn ৳2.00 per referral:\n\n${link}`,
            buttons: [{id: 'copy', type: 'default', text: 'Copy Link'}, {type: 'cancel', text: 'Close'}]
        }, function(id) {
            if (id === 'copy') {
                navigator.clipboard.writeText(link);
                tg.showAlert("Link Copied!");
            }
        });
    }

    function updateDB(amount, msg) {
        fetch(`${apiBase}/api/add-balance`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chatId: userId, amount: amount })
        }).then(res => res.json()).then(data => {
            document.getElementById('balance-val').innerText = data.newBalance.toFixed(2);
            tg.showAlert(msg);
        });
    }

    function showWithdraw() { tg.showAlert("মিনিমাম উইথড্র ৫০ টাকা।"); }
    function showProfile() { tg.showAlert(`User: ${tg.initDataUnsafe.user.first_name}\nID: ${userId}\nStatus: Active ✅`); }
</script>
</body>
</html>
