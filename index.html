<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD - Official</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11003133' data-sdk='show_11003133'></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: auto; }
        
        /* প্রোফাইল কার্ড */
        .profile-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; }
        .balance-amount { font-size: 30px; color: #2e7d32; font-weight: bold; margin: 10px 0; }

        /* ব্যানার স্টাইল */
        .banner-box { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .banner-box img { width: 100%; display: block; }

        /* বাটন গ্রিড */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: white; border: none; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-main { grid-column: span 2; background: #4834d4; color: white; padding: 20px; font-size: 18px; }
        
        /* শেয়ার বাটন স্টাইল */
        .share-btn { background: #0088cc; color: white; margin-top: 10px; width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- ব্যানার সেকশন -->
    <div class="banner-box">
        <!-- আপনার ব্যানারের ছবির লিঙ্ক নিচের src তে বসান -->
        <img src="https://via.placeholder.com/400x150.png?text=Earn+Money+BD+Official+Banner" alt="Banner">
    </div>

    <div class="profile-card">
        <div id="user-name" style="font-weight: bold;">Loading...</div>
        <div class="balance-amount">৳ <span id="balance-val">0.00</span></div>
    </div>

    <div class="menu-grid">
        <button class="btn btn-main" onclick="watchAd()">📺 ভিডিও দেখে ইনকাম</button>
        <button class="btn" onclick="claimDaily()">🎁 ডেইলি রিওয়ার্ড</button>
        <button class="btn" onclick="showProfile()">👤 প্রোফাইল</button>
        <button class="btn" onclick="showWithdraw()">💸 উইথড্র</button>
        <button class="btn" onclick="showRefer()">👥 রেফার ও শেয়ার</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe.user.id;
    const apiBase = "https://earn-money-bd.onrender.com";

    function loadUser() {
        document.getElementById('user-name').innerText = "হ্যালো, " + tg.initDataUnsafe.user.first_name;
        fetch(`${apiBase}/api/user/${userId}`).then(res => res.json()).then(data => {
            document.getElementById('balance-val').innerText = data.balance.toFixed(2);
        });
    }
    loadUser();

    // ১. ডেইলি রিওয়ার্ড লিমিট (২৪ ঘণ্টা)
    function claimDaily() {
        const lastClaim = localStorage.getItem('last_claim_' + userId);
        const now = new Date().getTime();

        if (lastClaim && (now - lastClaim) < 24 * 60 * 60 * 1000) {
            const hoursLeft = Math.ceil((24 * 60 * 60 * 1000 - (now - lastClaim)) / (1000 * 60 * 60));
            tg.showAlert(`আপনি অলরেডি ক্লেইম করেছেন! আরও ${hoursLeft} ঘণ্টা অপেক্ষা করুন।`);
        } else {
            localStorage.setItem('last_claim_' + userId, now);
            updateDB(1.00, "১ টাকা ডেইলি বোনাস পেয়েছেন!");
        }
    }

    // ২. রিয়াল রেফার ও শেয়ার লিঙ্ক
    function showRefer() {
        const referLink = `https://t.me/Emoneybd_Bot?start=${userId}`;
        
        tg.showPopup({
            title: 'রেফার ও ইনকাম',
            message: `আপনার লিঙ্ক: ${referLink}\nপ্রতি রেফারে পাবেন ২ টাকা!`,
            buttons: [
                {id: 'copy', type: 'default', text: 'লিঙ্ক কপি করুন'},
                {id: 'share', type: 'default', text: 'সোশ্যাল মিডিয়ায় শেয়ার'},
                {type: 'cancel', text: 'বন্ধ করুন'}
            ]
        }, function(buttonId) {
            if (buttonId === 'copy') {
                navigator.clipboard.writeText(referLink);
                tg.showAlert("লিঙ্ক কপি করা হয়েছে!");
            }
            if (buttonId === 'share') {
                const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(referLink)}&text=${encodeURIComponent("এই অ্যাপ থেকে প্রতিদিন ইনকাম করুন!")}`;
                tg.openTelegramLink(shareUrl);
            }
        });
    }

    function watchAd() {
        if (typeof show_11003133 === 'function') {
            show_11003133().then(() => { updateDB(0.50, "০.৫০ টাকা যোগ হয়েছে!"); });
        }
    }

    function updateDB(amount, msg) {
        fetch(`${apiBase}/api/add-balance`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chatId: userId, amount: amount })
        }).then(res => res.json()).then(data => {
            document.getElementById('balance-val').innerText = data.newBalance.toFixed(2);
            tg.showAlert(msg);
        });
    }

    function showWithdraw() { tg.showAlert("মিনিমাম উইথড্র ৫০ টাকা।"); }
    function showProfile() { tg.showAlert(`নাম: ${tg.initDataUnsafe.user.first_name}\nআইডি: ${userId}`); }
</script>
</body>
</html>
