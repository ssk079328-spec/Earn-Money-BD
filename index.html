<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- এখানে আপনার মনিটেগ থেকে দেওয়া SDK স্ক্রিপ্ট লিঙ্কটি বসান -->
    <script src='//protagery.com/v1/sdk.js'></script> 

    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; text-align: center; padding: 20px; color: #333; }
        .app-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .balance-text { font-size: 18px; color: #777; margin-bottom: 5px; }
        .balance-amount { font-size: 36px; color: #2ecc71; font-weight: bold; margin-bottom: 25px; }
        .btn-earn { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-earn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-card">
        <h2 id="user-greeting">Loading...</h2>
        <div class="balance-text">আপনার মোট ব্যালেন্স</div>
        <div class="balance-amount">৳ <span id="user-balance">0.00</span></div>
        
        <button onclick="playAd()" class="btn-earn">📺 ভিডিও দেখে আয় করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user.id;
        const apiBase = "https://earn-money-bd.onrender.com"; // আপনার রেন্ডার ইউআরএল

        // ডাটা লোড করা
        function fetchUserData() {
            document.getElementById('user-greeting').innerText = "হ্যালো, " + tg.initDataUnsafe.user.first_name;
            fetch(`${apiBase}/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.balance !== undefined) {
                        document.getElementById('user-balance').innerText = data.balance.toFixed(2);
                    }
                });
        }
        fetchUserData();

        // বিজ্ঞাপন দেখানো এবং রিওয়ার্ড দেওয়া
        function playAd() {
            // আপনার Rewarded Ad কোড
            show_11003133().then(() => {
                // বিজ্ঞাপন শেষ হলে রিয়াল-টাইম আপডেট
                rewardUser(0.50); 
            }).catch(e => {
                alert("বিজ্ঞাপন লোড হয়নি, আবার চেষ্টা করুন।");
            });
        }

        function rewardUser(amount) {
            fetch(`${apiBase}/api/add-balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId: userId, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('user-balance').innerText = data.newBalance.toFixed(2);
                    tg.showAlert("অভিনন্দন! আপনি ০.৫০ টাকা আয় করেছেন।");
                }
            });
        }
    </script>
</body>
</html>
